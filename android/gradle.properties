# ---------------------------------------------------------------------------
# Gradle 全局配置（旧樱丘高中记录室残存档案 / Android WebView 包装）
# ---------------------------------------------------------------------------

# 构建 JVM 参数：CI 的 ubuntu-latest 默认 16GB 内存，2~3GB 给 Gradle 足够。
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError

# 并行与缓存（CI 上配合 actions/setup-java 的 gradle cache 生效）
org.gradle.parallel=true
org.gradle.caching=true

# 本工程不依赖 AndroidX / Jetifier（纯 framework API），显式关闭以加快构建。
# 注意：AGP 8 允许在没有 androidx 依赖时保持 useAndroidX=false。
android.useAndroidX=false
android.enableJetifier=false

# 生成 R 类时只包含本模块资源，加快构建
android.nonTransitiveRClass=true

# 本项目不用 Configuration Cache（避免个别 CI 环境下的兼容问题）
org.gradle.configuration-cache=false
