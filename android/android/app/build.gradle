// ============================================================================
// app 模块构建脚本
// 旧樱丘高中记录室残存档案 —— 纯 WebView 离线包装（无第三方 SDK / 无 AndroidX）
// ----------------------------------------------------------------------------
// 版本号（上架 TapTap 每次更新必须递增 versionCode）：
//   默认 versionCode 11 / versionName 1.1.0，与 H5 版本 V1.1.0 对齐。
//   发布新版时可直接改这里，或在命令行覆盖：
//     ./gradlew assembleRelease -PappVersionCode=12 -PappVersionName=1.1.1
// ----------------------------------------------------------------------------
// H5 资源来源（webRoot）：
//   默认 ${rootProject.projectDir}/..  （也就是仓库根目录 = GitHub Pages 站点根）
//   CI 里显式传 -PwebRoot="$GITHUB_WORKSPACE"。
//   本地可用 -PwebRoot=../pages 或 -PwebRoot=..\pages 指向 H5 站点目录。
//   任务 copyWebAssets 把 index.html / css / js / assets / privacy.html 等
//   复制到 app/src/main/assets/www/，最终打包进 APK 的 assets/www/，
//   由 MainActivity 以 file:///android_asset/www/index.html 离线加载。
// ============================================================================

plugins {
    id 'com.android.application'
}

// ------------------------- 可覆盖的版本号 -------------------------
def appVersionCode = ((project.findProperty('appVersionCode') ?: '11') as String).trim().toInteger()
def appVersionName = ((project.findProperty('appVersionName') ?: '1.1.0') as String).trim()

// ------------------------- H5 站点根目录 -------------------------
// 默认值 = ${rootProject.projectDir}/..；可用 -PwebRoot=<绝对或相对路径> 覆盖。
def webRootRaw = ((project.findProperty('webRoot') ?: '') as String).trim()
def webRootDir = webRootRaw.isEmpty()
        ? rootProject.projectDir.parentFile          // ${rootProject.projectDir}/..
        : new File(webRootRaw)
if (webRootDir != null && !webRootDir.isAbsolute()) {
    // 相对路径按 android/ 目录解析，避免受 Gradle daemon 工作目录影响
    webRootDir = new File(rootProject.projectDir, webRootRaw)
}
webRootDir = webRootDir.canonicalFile

def wwwDestDir = new File(project.projectDir, 'src/main/assets/www')

// ------------------------- release 签名配置 -------------------------
// CI：workflow 从 Secrets 的 KEYSTORE_BASE64 解码出 app/release.keystore，
//     并把 KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD 注入环境变量。
// 本地：也可以自己生成 release.keystore 并 export 同样的环境变量。
// 没有 release.keystore 时（例如还没有配 Secrets），release 构建自动退回 debug 签名，
// 这样 CI 依然能产出可安装、可自测的 APK（但不能用于 TapTap 正式上传/覆盖更新）。
def keystoreRelPath = ((project.findProperty('keystorePath') ?: 'release.keystore') as String).trim()
def releaseKeystoreFile = new File(project.projectDir, keystoreRelPath)
def hasReleaseKeystore = releaseKeystoreFile.isFile()

def envKeystorePassword = System.getenv('KEYSTORE_PASSWORD')
def envKeyAlias = System.getenv('KEY_ALIAS')
def envKeyPassword = System.getenv('KEY_PASSWORD')

if (hasReleaseKeystore && (envKeystorePassword == null || envKeystorePassword.isEmpty())) {
    throw new GradleException(
            "检测到 ${releaseKeystoreFile}，但环境变量 KEYSTORE_PASSWORD 为空/未设置。\n" +
            "本地构建请先设置 KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD 环境变量；\n" +
            "CI 构建请检查仓库 Secrets 是否配置完整（KEYSTORE_BASE64、KEYSTORE_PASSWORD、KEY_ALIAS、KEY_PASSWORD）。\n" +
            "详细说明见 android/README-APK.md。")
}

// 先在这里把可能为空的 secret 解析成确定值，避免在 DSL 闭包里写复杂三元表达式
def resolvedKeyAlias = (envKeyAlias == null || envKeyAlias.isEmpty()) ? 'sakuraoka' : envKeyAlias
// PKCS12 keystore 的 key 密码 = store 密码；KEY_PASSWORD 未配置时自动回退
def resolvedKeyPassword = (envKeyPassword == null || envKeyPassword.isEmpty())
        ? envKeystorePassword : envKeyPassword

android {
    namespace 'com.sakuraoka.records'
    compileSdk 34
    // 与 CI 安装的 SDK 组件保持一致（GitHub Actions 里装的是 34.0.0）
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId 'com.sakuraoka.records'
        minSdk 23
        targetSdk 34

        versionCode appVersionCode
        versionName appVersionName

        // 纯 Java + framework API，不需要任何测试依赖
        // （故意不引入 AndroidX，减少依赖下载与体积）
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        // 源码里有中文注释：显式指定 UTF-8，避免在 GBK 默认编码的 Windows 上编译乱码
        encoding 'UTF-8'
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile = releaseKeystoreFile
                storePassword = envKeystorePassword
                keyAlias = resolvedKeyAlias
                keyPassword = resolvedKeyPassword
                // v1/v2 签名开关不显式设置：AGP 会按 minSdk 自动选择
                // （minSdk 23 时自动 v1 生效，同时默认带 v2，兼容 Android 5.0 ~ 最新）
            }
        }
    }

    buildTypes {
        release {
            // 本工程没有需要混淆的业务代码；为避免 WebView JS 反射/调试问题，关闭混淆。
            minifyEnabled false
            shrinkResources false
            signingConfig = hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // 不生成 BuildConfig（用不到；MainActivity 通过 ApplicationInfo 判断 debuggable）
    buildFeatures {
        buildConfig false
    }

    lint {
        // APK 由 CI 构建，不因 lint 警告中断（真正问题看构建日志/安装自测）
        abortOnError false
        checkReleaseBuilds false
    }

    // 说明：本工程没有任何第三方依赖（无 AndroidX / 无 META-INF 冲突），
    // 因此不需要 packaging { resources { excludes ... } } 之类的配置。
}

// ============================================================================
// copyWebAssets：把 H5 站点（webRoot）复制到 app/src/main/assets/www/
// 使用 Sync：每次全量同步，自动删除上次残留的旧文件，保证 APK 里没有过时资源。
// ============================================================================
tasks.register('copyWebAssets', Sync) {
    group = 'sakuraoka'
    description = '把 H5 站点（-PwebRoot，默认仓库根目录）同步到 app/src/main/assets/www'

    from webRootDir
    into wwwDestDir

    // 只复制游戏运行所需的站点文件（离线包体，不带任何仓库/工程文件）
    include 'index.html'
    include 'privacy.html'
    include 'manifest.webmanifest'
    include 'favicon.ico'
    include 'favicon.png'
    include 'favicon.svg'
    include 'css/**'
    include 'js/**'
    include 'assets/**'

    // 双重保险：绝不把工程/仓库文件打进 APK
    exclude 'android/**'
    exclude '.git/**'
    exclude '.github/**'
    exclude 'node_modules/**'
    exclude '**/node_modules/**'
    exclude '**/README*'
    exclude '**/.DS_Store'
    exclude '**/*.map'
    exclude '**/Thumbs.db'

    doFirst {
        if (!webRootDir.isDirectory()) {
            throw new GradleException(
                    "webRoot 目录不存在：${webRootDir}\n" +
                    "请用 -PwebRoot=<H5 站点根目录> 指定。CI 里应传 -PwebRoot=\"\$GITHUB_WORKSPACE\"；\n" +
                    "本地自测可传 -PwebRoot=../pages（sakuraoka/pages 为站点根）。")
        }
        if (!new File(webRootDir, 'index.html').isFile()) {
            throw new GradleException(
                    "webRoot 下找不到 index.html：${new File(webRootDir, 'index.html')}\n" +
                    "webRoot 必须指向 H5 站点根目录（含 index.html / css / js / assets）。")
        }
        logger.lifecycle("[copyWebAssets] source = ${webRootDir}")
        logger.lifecycle("[copyWebAssets] dest   = ${wwwDestDir}")
    }

    doLast {
        int count = 0
        long bytes = 0L
        wwwDestDir.eachFileRecurse { f ->
            if (f.isFile()) {
                count++
                bytes += f.length()
            }
        }
        if (count == 0) {
            throw new GradleException("copyWebAssets 没有复制到任何文件，请检查 webRoot：${webRootDir}")
        }
        logger.lifecycle(String.format("[copyWebAssets] copied %d files (%.2f MB) -> OK",
                count, bytes / 1024.0d / 1024.0d))
    }
}

// 保证所有编译/打包任务之前先复制 H5 资源。
// 用 configureEach 而不是直接引用任务，避免依赖 AGP 创建任务（preBuild / merge*Assets）
// 的时机：不管它们什么时候被注册，都会挂上 copyWebAssets。
tasks.configureEach { task ->
    if (task.name == 'preBuild'
            || (task.name.startsWith('merge') && task.name.endsWith('Assets'))) {
        task.dependsOn tasks.named('copyWebAssets')
    }
}

// clean 时同时清掉生成的 www 资源
tasks.register('cleanWebAssets', Delete) {
    group = 'sakuraoka'
    description = '删除 app/src/main/assets/www（由 copyWebAssets 生成）'
    delete wwwDestDir
}

tasks.named('clean').configure {
    dependsOn tasks.named('cleanWebAssets')
}
