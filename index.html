<!DOCTYPE html>
<html lang="zh-CN" data-fs="m">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000080">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="旧樱丘高中记录室残存档案：1998 年日式复古校园网站风格的互动叙事解谜游戏。三幕故事、4 个结局、证据合成推理板，离线可玩。">
<title>旧樱丘高中记录室残存档案 V1.1.0</title>
<link rel="icon" type="image/svg+xml" href="assets/logo-sakura.svg">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/chrome.css">
<link rel="stylesheet" href="css/site.css">
<link rel="stylesheet" href="css/archive.css">
<link rel="stylesheet" href="css/memo.css">
<link rel="stylesheet" href="css/screens.css">
<link rel="stylesheet" href="css/mobile.css">
</head>
<body class="page-body">
<!-- 游戏根节点：所有界面由 js/ui/screens.js 渲染到这里 -->
<div id="app" class="app-root" role="application" aria-label="旧樱丘高中记录室残存档案">
  <noscript>
    <div class="noscript">此游戏需要启用 JavaScript 才能运行。</div>
  </noscript>
</div>
<!-- 全局轻提示（证据入手、错误提示等） -->
<div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
<!-- 全局读屏播报区 -->
<div id="sr-live" class="sr-only" aria-live="polite"></div>

<!-- ===== 基础命名空间（classic script，无构建步骤） ===== -->
<script src="js/namespace.js"></script>

<!-- ===== 数据层：证据 / 文档 / 剧情页面 / 结局 / 提示 / UI 文案 ===== -->
<script src="js/data/clues.js"></script>
<script src="js/data/documents.js"></script>
<script src="js/data/endings.js"></script>
<script src="js/data/ui-text.js"></script>
<script src="js/data/pages-act1.js"></script>
<script src="js/data/pages-act2.js"></script>
<script src="js/data/pages-act3.js"></script>
<script src="js/data/hints.js"></script>

<!-- ===== 核心层：存档 / 状态 / 音效 / 推理板 / 谜题 / 路由 ===== -->
<script src="js/core/storage.js"></script>
<script src="js/core/state.js"></script>
<script src="js/core/audio.js"></script>
<script src="js/core/taptap.js"></script>
<script src="js/core/board.js"></script>
<script src="js/core/puzzles.js"></script>
<script src="js/core/router.js"></script>

<!-- ===== 表现层：DOM 外壳 / 界面 / 弹窗 / 事件绑定 ===== -->
<script src="js/ui/toast.js"></script>
<script src="js/ui/shell.js"></script>
<script src="js/ui/screens.js"></script>
<script src="js/ui/overlays.js"></script>
<script src="js/ui/bind.js"></script>

<!-- ===== 启动入口与调试 API ===== -->
<script src="js/main.js"></script>
<script src="js/debug.js"></script>
</body>
</html>
